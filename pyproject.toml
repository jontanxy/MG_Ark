[project]
name = "mg-archive-bot"
version = "1.0.0"
description = "Telegram-based Motion Graphics archive management system integrated with Google Drive"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=22.8,<23",
    "SQLAlchemy>=2.0.40,<3",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-httplib2>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
oauth = ["google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mg-archive-bot = "mg_archive_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mg_archive_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
